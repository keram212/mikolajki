<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikołajkowe losowanie 🎅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #fff7e8;
  background:
    radial-gradient(circle at 20% 10%, #35634b 0, transparent 35%),
    linear-gradient(145deg, #102c25, #173e31 60%, #10251f);
}
.card {
  width: 100%;
  max-width: 430px;
  padding: 32px 24px;
  text-align: center;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.17);
  border-radius: 24px;
  box-shadow: 0 20px 60px #0005;
}
.santa { font-size: 64px; }
h1 { font-size: 29px; margin: 12px 0 8px; }
.subtitle { color: #e7d9bb; line-height: 1.6; }
select, button {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  border-radius: 12px;
  font-size: 16px;
}
select {
  color: #23352b;
  background: #fffaf0;
  border: 0;
}
button {
  color: white;
  background: #b52e36;
  border: 0;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}
button:hover { background: #d13d45; }
button:disabled { opacity: .55; cursor: wait; }
#result {
  display: none;
  margin-top: 25px;
  padding: 22px 12px;
  border-radius: 16px;
  background: #fff6e4;
  color: #203c2d;
}
#result strong {
  display: block;
  margin-top: 10px;
  color: #a72530;
  font-size: 30px;
}
#error { color: #ffd0d0; margin-top: 16px; }
.footer { margin-top: 25px; font-size: 12px; color: #c5d3c8; }
</style>
</head>
<body>
<main class="card">
  <div class="santa">🎅</div>
  <h1>Mikołajkowe losowanie</h1>
  <p class="subtitle">
    Rodzinna edycja 2026 🎄<br>
    Wybierz swoje imię i sprawdź,<br>
    komu przygotujesz prezent!
  </p>

  <select id="name">
    <option value="">Wybierz swoje imię...</option>
    <option>Antek</option>
    <option>Marek</option>
    <option>Dominika</option>
    <option>Alina</option>
    <option>Marysia</option>
  </select>

  <button id="draw">🎁 Wylosuj osobę</button>

  <div id="result">
    <div>W tym roku robisz prezent dla:</div>
    <strong id="recipient"></strong>
    <p>Ho, ho, ho! Nie zdradź nikomu swojej tajemnicy! 🤫</p>
  </div>

  <div id="error"></div>

  <div class="footer">
    Każdy losuje tylko raz. Wynik jest zapisany na serwerze.
    <br>Wesołych Mikołajek! ❤️
  </div>
</main>

<script>
const SUPABASE_URL = "https://zmprlwgecqvifmshqphp.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_Jfj-v6AOhVj-NSZvkqLUgg_oAQ29-0f";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const button = document.getElementById("draw");
const select = document.getElementById("name");
const result = document.getElementById("result");
const recipient = document.getElementById("recipient");
const error = document.getElementById("error");

button.addEventListener("click", async () => {
  const name = select.value;

  error.textContent = "";
  result.style.display = "none";

  if (!name) {
    error.textContent = "Najpierw wybierz swoje imię! 🎅";
    return;
  }

  button.disabled = true;
  button.textContent = "Losuję... 🎄";

  try {
    const { data, error: rpcError } = await db.rpc(
      "draw_for",
      { p_name: name }
    );

    if (rpcError) throw rpcError;

    recipient.textContent = data.recipient;
    result.style.display = "block";

    button.textContent = "🎁 Twoje losowanie gotowe";
    select.disabled = true;

  } catch (err) {
    console.error(err);
    error.textContent =
      "Coś poszło nie tak. Spróbuj ponownie za chwilę.";
    button.disabled = false;
    button.textContent = "🎁 Spróbuj ponownie";
  }
});
</script>
</body>
</html>
